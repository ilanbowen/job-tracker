apiVersion: v1
kind: Service
metadata:
  name: {{ include "job-tracker.fullname" . }}-app
  namespace: {{ include "job-tracker.namespace" . }}
  labels:
    {{- include "job-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "job-tracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
