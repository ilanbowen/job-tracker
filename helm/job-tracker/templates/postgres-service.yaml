apiVersion: v1
kind: Service
metadata:
  name: {{ include "job-tracker.fullname" . }}-postgres
  namespace: {{ include "job-tracker.namespace" . }}
  labels:
    {{- include "job-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
  selector:
    {{- include "job-tracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
