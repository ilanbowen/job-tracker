apiVersion: v1
kind: Secret
metadata:
  name: {{ include "job-tracker.fullname" . }}-secret
  namespace: {{ include "job-tracker.namespace" . }}
  labels:
    {{- include "job-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ include "job-tracker.databaseUrl" . | quote }}
  TAVILY_API_KEY: {{ .Values.linkedinLookup.tavilyApiKey | default "" | quote }}
